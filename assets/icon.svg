<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856D6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Car icon simplified -->
  <g transform="translate(256, 256)">
    <!-- Car body -->
    <rect x="-120" y="-40" width="240" height="80" rx="15" fill="white" opacity="0.95"/>
    <!-- Car top -->
    <path d="M -80 -40 L -60 -80 L 60 -80 L 80 -40 Z" fill="white" opacity="0.95"/>
    <!-- Wheels -->
    <circle cx="-70" cy="50" r="25" fill="white" opacity="0.95"/>
    <circle cx="70" cy="50" r="25" fill="white" opacity="0.95"/>
    <circle cx="-70" cy="50" r="15" fill="#333"/>
    <circle cx="70" cy="50" r="15" fill="#333"/>
    
    <!-- Letter B -->
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#007AFF" text-anchor="middle">B</text>
  </g>
</svg>
