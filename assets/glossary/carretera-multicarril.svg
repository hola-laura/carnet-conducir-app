<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#dfe7ef"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- post -->
  <rect x="194" y="250" width="12" height="50" fill="#9aa3ab"/>

  <!-- sign panel -->
  <g filter="url(#sh)">
    <rect x="128" y="18" width="144" height="236" rx="14" fill="#ffffff"/>
  </g>
  <rect x="135" y="25" width="130" height="222" rx="9" fill="none" stroke="#141414" stroke-width="5"/>

  <!-- text -->
  <g font-family="DM Sans, Arial, Helvetica, sans-serif" font-weight="800" fill="#141414" text-anchor="middle">
    <text x="200" y="64" font-size="27" letter-spacing="1">MULTI-</text>
    <text x="200" y="93" font-size="27" letter-spacing="1">CARRIL</text>
  </g>

  <!-- pictogram -->
  <g fill="#141414">
    <!-- incoming road (top, narrow) -->
    <path d="M186 104 L190 104 L188 128 L183 128 Z"/>
    <path d="M210 104 L214 104 L217 128 L212 128 Z"/>
    <rect x="198" y="104" width="4" height="8" rx="1"/>
    <rect x="198" y="117" width="4" height="8" rx="1"/>
    <!-- side branches -->
    <path d="M144 146 Q164 134 186 134 L186 139 Q166 140 150 150 Z"/>
    <path d="M256 146 Q236 134 214 134 L214 139 Q234 140 250 150 Z"/>
    <!-- central island (roundabout) -->
    <ellipse cx="200" cy="146" rx="22" ry="8"/>
    <!-- outgoing road, widening -->
    <path d="M176 158 L182 158 L166 236 L154 236 Z"/>
    <path d="M218 158 L224 158 L246 236 L234 236 Z"/>
    <path d="M197.5 158 L202.5 158 L204 236 L196 236 Z"/>
    <g>
      <path d="M187 166 L190 166 L187.5 180 L184 180 Z"/>
      <path d="M182.5 192 L186 192 L183 208 L179 208 Z"/>
      <path d="M177.5 220 L181.5 220 L178.5 236 L174 236 Z"/>
      <path d="M210 166 L213 166 L216 180 L212.5 180 Z"/>
      <path d="M214 192 L217.5 192 L221 208 L217 208 Z"/>
      <path d="M218.5 220 L222.5 220 L226 236 L221.5 236 Z"/>
    </g>
    <!-- ramps leaving the sides -->
    <path d="M150 156 Q160 166 168 168 L167 173 Q155 170 144 160 Z"/>
    <path d="M250 156 Q240 166 232 168 L233 173 Q245 170 256 160 Z"/>
  </g>
</svg>
